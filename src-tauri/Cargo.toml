[package]
name = "murasame-desktop-pet"
version = "0.1.0"
description = "Murasame desktop pet"
authors = ["Ljy"]
edition = "2021"

[lib]
name = "murasame_desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
